// Wurzel-Build der Android-App. Die Plugins von Capacitor bringen ihre eigene Konfiguration mit.

buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Nur der Build mit Firebase (Flavor fcm) wendet es an, der Standard-Build bleibt frei von Google-Diensten
        classpath 'com.google.gms:google-services:4.5.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
