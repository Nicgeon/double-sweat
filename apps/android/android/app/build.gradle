import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Firebase Cloud Messaging steckt nur im Flavor "fcm". Das Plugin verlangt google-services.json und wird deshalb nur
// angewendet, wenn dieser Flavor gebaut wird; der Standard-Build (foss) braucht weder die Datei noch Google-Bibliotheken.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('fcm') }) {
    apply plugin: 'com.google.gms.google-services'
}

// Version aus apps/android/package.json: versionName = "1.2.3", versionCode = 10203
def appVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()
def versionParts = appVersion.split('-')[0].tokenize('.').collect { it.toInteger() }

// Signatur für das Release: apps/android/signing/keystore.properties (nie im Repository, erzeugt scripts/gen-keystore.sh)
def signingProps = file('../../signing/keystore.properties')
def keystore = new Properties()
if (signingProps.exists()) {
    signingProps.withInputStream { keystore.load(it) }
}

android {
    namespace = "app.doublesweat.mobile"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.doublesweat.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName appVersion
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (signingProps.exists()) {
                storeFile new File(signingProps.parentFile, keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Läuft neben dem Release; Klartext-HTTP und Web-Debugging gibt es nur hier (siehe src/debug)
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (signingProps.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // foss: UnifiedPush, keine Google-Bibliotheken. fcm: zusätzlich Firebase Cloud Messaging (siehe README)
    flavorDimensions = ['distribution']
    productFlavors {
        foss {
            dimension = 'distribution'
        }
        fcm {
            dimension = 'distribution'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError = true
        warningsAsErrors = false
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    // Push über einen frei wählbaren Verteiler (ntfy u. a.), ohne Google-Dienste
    implementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
    // Nur im Flavor fcm; Nachrichten kommen Ende-zu-Ende verschlüsselt (WebPushCrypto), Google sieht keinen Inhalt
    fcmImplementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    fcmImplementation 'com.google.firebase:firebase-messaging'
    // Prüft, ob die Google Play-Dienste auf dem Gerät vorhanden sind (es gibt auch Geräte ohne)
    fcmImplementation "com.google.android.gms:play-services-base:$playServicesBaseVersion"

    testImplementation "junit:junit:$junitVersion"
    // Auf der JVM sind die org.json-Klassen von Android nur Attrappen
    testImplementation "org.json:json:$jsonTestVersion"
}

apply from: 'capacitor.build.gradle'
