# Double Sweat, ein Container. Konfiguration über .env (Vorlage: .env.example).
#
#   cp .env.example .env     # PUBLIC_URL und SETUP_TOKEN setzen
#   docker compose pull      # fertiges Image aus der GitHub-Registry (amd64 und arm64) ...
#   docker compose up -d     # ... und starten. Update: dieselben zwei Befehle.
#
# Ohne "pull" (oder mit "up -d --build") baut Compose das Image selbst aus dem Quelltext (build). Eigener Fork oder
# feste Version: DS_IMAGE in der .env setzen, z. B. ghcr.io/nicgeon/double-sweat:0.2 (siehe README, Abschnitt Betrieb).
#
# Der Port ist nur lokal (127.0.0.1) erreichbar. HTTPS macht der Reverse-Proxy davor (Kamera und Push brauchen
# zwingend HTTPS), Beispiele in deploy/. Es darf nur EINE Instanz laufen (SQLite und Scheduler im Prozess).
services:
  app:
    build: .
    image: ${DS_IMAGE:-ghcr.io/nicgeon/double-sweat:latest}
    container_name: double-sweat
    init: true
    restart: unless-stopped
    env_file: .env
    # Container-interne Werte haben Vorrang vor der .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - data:/data
    # Härtung: unveränderliches Dateisystem, keine Zusatzrechte
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
